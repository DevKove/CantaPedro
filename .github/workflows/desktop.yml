name: Build and Release CantaPedro for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'audio-engine.js'
      - 'midi-parser.js'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/desktop.yml'
concurrency:
  group: cantapedro-windows-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read application version
        id: app-version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Install dependencies
        run: npm install
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run automated regression tests
        run: npm test
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: CantaPedro-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.app-version.outputs.version }}
          name: CantaPedro ${{ steps.app-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release/CantaPedro.Setup.${{ steps.app-version.outputs.version }}.exe
          token: ${{ secrets.GITHUB_TOKEN }}
